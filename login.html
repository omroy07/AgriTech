<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AgriTech</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Prevent theme flash on page load -->
  <script>
    (function () {
      const saved = localStorage.getItem('agritech-theme') || localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>

  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="theme.css">
</head>

<body
  style="background-image: url('images/login.avif'); background-size: cover; background-position: center; background-repeat: no-repeat;">
  <div class="loginContainer">

    <div class="form-container">
        <!-- Animated Sun/Moon Toggle -->
      <div style="position: absolute; top: 20px; right: 20px;">
        <button class="theme-toggle" type="button" id="themeToggle" title="Switch to dark mode"
          aria-label="Switch to dark mode">
        <span class="theme-toggle-track">
          <span class="theme-toggle-icon sun-icon" aria-hidden="true">
            <i class="fas fa-sun"></i>
          </span>
          <span class="theme-toggle-icon moon-icon" aria-hidden="true">
            <i class="fas fa-moon"></i>
          </span>
          <span class="theme-toggle-thumb"></span>
        </span>
      </button>
      </div>
      <div class="lamp-container">
        <button id="lampToggle" type="button">💡 ON</button>
    </div>

      <div id="darkOverlay" class="hidden"></div>
      <!-- Brand section -->
      <div class="brand-section">
        <a href="./index.html" class="brand-icon">
          <i class="fas fa-seedling"></i>
        </a>
        <h2>Login AgriTech</h2>
        <p class="form-subtitle">Login to get started</p>
      </div>

      <!-- Login form — unchanged -->
      <form onsubmit="handleLogin(event)" novalidate>
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Enter your password" required minlength="8" aria-describedby="loginPasswordError">
          <button type="button" class="password-toggle" onclick="togglePassword()">
            <i class="fas fa-eye" id="password-eye"></i>
          </button>
        </div>
        <div class="field-error" id="loginPasswordError" aria-live="polite"></div>

        <div class="forgot-password">
          <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>
        <p>Don't have an account? <a href="register.html">Register</a></p>
      </form>
    </div>

  </div>

  <!--
    CHANGED: auth.js is now type="module" (required for Firebase ESM imports).
    login.js and theme.js remain normal scripts.
  -->
  <script type="module" src="auth.js"></script>
  <script src="login.js"></script>
  <script src="theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      redirectIfLoggedIn();
    });
  </script>
</body>

</html>
